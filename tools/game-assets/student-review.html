<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生实际渲染预览</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#23354d;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{padding:32px max(24px,calc((100vw - 1200px)/2));background:#fff;border-bottom:1px solid #dce5f0}h1{font-size:28px;margin:0 0 12px}p{line-height:1.8;margin:8px 0;color:#586b83}main{max-width:1250px;margin:auto;padding:24px}.toolbar{position:sticky;top:0;background:#f3f6fcf5;padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;z-index:2}input,select,button,textarea{font:inherit;border:1px solid #bdcce0;border-radius:9px;padding:10px;background:white;color:inherit}input{flex:1;min-width:220px}button,a{cursor:pointer}button:hover{background:#e4efff}.card{background:white;border:1px solid #dce5f0;border-radius:16px;margin-bottom:22px;overflow:hidden}.top{padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.top h2{font-size:18px;margin:0;margin-right:auto}.meta{font-size:13px;color:#697c92}.preview{display:block;width:100%;height:auto;background:#edf1f7;cursor:zoom-in}.pending{padding:45px;text-align:center;color:#6b7c93}.bottom{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.note{width:100%;min-height:65px}.badge{background:#e6effa;border-radius:20px;padding:5px 10px;font-size:13px}.warn{background:#fff2dc;color:#78521c}a{color:#205bb2}.paging{display:flex;justify-content:center;gap:14px;padding:20px}.empty{padding:40px;text-align:center}dialog{max-width:98vw;width:1600px;border:0;border-radius:16px;padding:18px;background:#f3f6fc}dialog::backdrop{background:#172537c9}dialog img{width:100%;display:block}dialog .controls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}dialog a{font-size:14px}.footnote{font-size:13px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #5992df}
</style>
<header><h1>学生实际渲染预览</h1><p id="summary"></p><p>每张卡片依次是：待机、眼睛 / 刘海特写、行走、抱起、倒地 / 等待、起身。点击图片放大，也可以打开未裁切的原始窗口截图。</p><p class="footnote">截图来自实际打包桌宠，尺寸 360、物理开启、原有相机 / 灯光 / 材质 / 描边。特写仅裁切同一张截图；卡片排版缩放不改变渲染。没有专用动作的模型展示程序当前的回退行为。静态截图不能代表动作全过程。</p></header>
<main><div class="toolbar"><input id="search" type="search" aria-label="搜索学生" placeholder="搜索中文、日文、英文名字或模型编号"><select id="filter" aria-label="筛选"><option value="all">全部</option><option value="pending">尚未检查</option><option value="issue">我标记的问题</option><option value="ok">我已检查</option><option value="warning">自动检查提示</option></select><button id="export">导出检查意见</button></div><p id="count"></p><div id="list"></div><nav class="paging"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav><p class="footnote">标记与备注保存在当前浏览器。检查后可导出意见文件交给我继续修复。古书馆尚无可用本体的 5 个角色 / 服装：霞（泳装）、叶莲娜、安娜、心、琴音。</p></main>
<dialog id="detail"><div class="controls"><button id="previousModel">← 上一个</button><strong id="detailTitle"></strong><button id="zoom">原图尺寸</button><button id="close">关闭 ✕</button><button id="nextModel">下一个 →</button></div><div style="overflow:auto"><img id="detailImage" alt="学生各动作实际截图"></div><p id="originals"></p></dialog>
<script>
const data=/*REVIEW_DATA*/[];
const $=id=>document.getElementById(id), key='ba-student-visual-review-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
let page=0,filtered=[],selected=null;const perPage=12;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>{try{localStorage.setItem(key,JSON.stringify(saved))}catch{}};
$('summary').textContent=`共 ${data.length} 个模型，已生成 ${data.filter(x=>x.ready).length} 个实际程序预览。预览生成时间：${new Date(/*GENERATED_AT*/0).toLocaleString('zh-CN')}`;
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;filtered=data.filter(x=>x.search.toLowerCase().includes(q)&&(f==='all'||f==='warning'&&x.errors?.length||f==='pending'&&!saved[x.id]?.status||saved[x.id]?.status===f));page=Math.min(page,Math.max(0,Math.ceil(filtered.length/perPage)-1));$('count').textContent=`找到 ${filtered.length} 个模型 · 已检查 ${Object.values(saved).filter(x=>x.status==='ok').length} · 问题 ${Object.values(saved).filter(x=>x.status==='issue').length}`;
$('list').innerHTML=filtered.slice(page*perPage,(page+1)*perPage).map(x=>`<article class="card" data-id="${esc(x.id)}"><div class="top"><h2>${esc(x.name)}</h2><span class="meta">模型 ${esc(x.id)}</span>${x.errors?.length?'<span class="badge warn">有自动检查提示</span>':''}<span class="badge">${x.ready?'实际程序截图':'待生成'}</span></div>${x.ready?`<img class="preview" loading="lazy" src="cards/${esc(x.id)}.png" alt="${esc(x.name)} 待机与动作预览" tabindex="0">`:'<div class="pending">正在生成此角色的实际截图</div>'}<div class="bottom"><select class="status" aria-label="检查状态"><option value="">尚未检查</option><option value="ok" ${saved[x.id]?.status==='ok'?'selected':''}>已检查，正常</option><option value="issue" ${saved[x.id]?.status==='issue'?'selected':''}>发现问题</option></select>${x.ready?`<a href="frames/${esc(x.id)}-idle.png" target="_blank">原始待机截图 ↗</a>`:''}<span class="meta">${esc(x.errors?.join('；'))}</span><textarea class="note" placeholder="备注：例如左眼、刘海、光环、衣服穿模……" aria-label="${esc(x.name)} 检查备注">${esc(saved[x.id]?.note||'')}</textarea></div></article>`).join('')||'<p class="empty">没有匹配的角色</p>';
$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(filtered.length/perPage))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*perPage>=filtered.length;}
function open(id){selected=id;const x=data.find(x=>x.id===id);if(!x?.ready)return;$('detailTitle').textContent=`${x.name} · ${x.id}`;$('detailImage').src=`cards/${id}.png`;$('originals').innerHTML=['idle','walk','held','down','rise'].map((k,i)=>`<a href="frames/${id}-${k}.png" target="_blank">${['待机','行走','抱起','倒地','起身'][i]}原图 ↗</a>`).join('　');if(!$('detail').open)$('detail').showModal();}
function move(delta){const available=filtered.filter(x=>x.ready),index=available.findIndex(x=>x.id===selected);if(available[index+delta])open(available[index+delta].id);}
$('list').addEventListener('click',e=>{if(e.target.matches('.preview'))open(e.target.closest('article').dataset.id)});$('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.preview'))open(e.target.closest('article').dataset.id)});
function saveReview(e){const article=e.target.closest('article');if(!article)return;const id=article.dataset.id;saved[id]={status:article.querySelector('.status').value,note:article.querySelector('.note').value};persist();$('count').textContent=`找到 ${filtered.length} 个模型 · 已检查 ${Object.values(saved).filter(x=>x.status==='ok').length} · 问题 ${Object.values(saved).filter(x=>x.status==='issue').length}`;}$('list').addEventListener('input',saveReview);$('list').addEventListener('change',saveReview);
$('search').oninput=$('filter').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render();scrollTo(0,0)};$('next').onclick=()=>{page++;render();scrollTo(0,0)};$('zoom').onclick=()=>{const full=$('detailImage').style.width==='1500px';$('detailImage').style.width=full?'100%':'1500px';$('zoom').textContent=full?'原图尺寸':'适应窗口';};$('close').onclick=()=>$('detail').close();$('previousModel').onclick=()=>move(-1);$('nextModel').onclick=()=>move(1);$('detail').addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
$('export').onclick=()=>{const notes=data.filter(x=>saved[x.id]?.status||saved[x.id]?.note).map(x=>({id:x.id,name:x.name,...saved[x.id]}));const blob=new Blob([JSON.stringify({generatedAt:new Date().toISOString(),reviews:notes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='学生检查意见.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></html>
