name: Publish verified desktop packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Windows and macOS run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful builds from this repository
        id: build
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.RUN_ID)) throw Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.RUN_ID)});
            if (run.conclusion !== 'success' || run.name !== 'Build Windows and macOS' || run.head_branch !== 'master' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw Error('Not a successful release build');
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: BA-Desktop-Pet-*
          path: verified-artifacts
      - name: Verify packages and update metadata against their build checksums
        id: packages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid version');
          const files = [];
          function walk(dir) { for (const e of fs.readdirSync(dir,{withFileTypes:true})) { const p=path.join(dir,e.name); if(e.isDirectory())walk(p); else if(e.name==='SHA256SUMS.txt')files.push(p); } }
          walk('verified-artifacts');
          if(files.length!==3)throw Error('Expected three platform manifests');
          fs.mkdirSync('publish');
          const lines=[], names=new Set();
          for(const manifest of files) for(const line of fs.readFileSync(manifest,'utf8').trim().split(/\r?\n/)) {
            const match=/^([a-f0-9]{64})  (BA-Desktop-Pet-[\w.-]+|latest\.yml)$/.exec(line);
            if(!match)throw Error('Invalid manifest');
            const [,hash,name]=match;
            if((name!=='latest.yml'&&!name.startsWith(`BA-Desktop-Pet-${version}-`))||names.has(name))throw Error('Unexpected package');
            const file=path.join(path.dirname(manifest),name);
            const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(actual!==hash)throw Error(`Checksum mismatch: ${name}`);
            fs.copyFileSync(file,path.join('publish',name)); names.add(name);lines.push(`${hash}  ${name}`);
          }
          const expected=['Setup-x64.exe','Portable-x64.exe','macOS-arm64.dmg','macOS-arm64.zip','macOS-x64.dmg','macOS-x64.zip'];
          expected.push('Setup-x64.exe.blockmap');
          if(names.size!==8||!names.has('latest.yml')||expected.some(s=>!names.has(`BA-Desktop-Pet-${version}-${s}`)))throw Error('Missing package');
          fs.writeFileSync('publish/SHA256SUMS.txt',lines.sort().join('\n')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`tag=v${version}\n`);
          NODE
      - name: Upload draft, verify remote digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.packages.outputs.tag }}
          COMMIT: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{execFileSync}=require('child_process');
          const base=`repos/${process.env.GITHUB_REPOSITORY}/releases`,tag=process.env.TAG;
          const gh=args=>execFileSync('gh',args,{encoding:'utf8'});
          // Drafts have no Git tag yet. Reuse their numeric ID, and use the
          // creation response directly: the release list can briefly lag.
          let release=JSON.parse(gh(['api',`${base}?per_page=100`])).find(r=>r.tag_name===tag);
          if(!release){
            fs.writeFileSync('release-request.json',JSON.stringify({tag_name:tag,target_commitish:process.env.COMMIT,draft:true,prerelease:false,name:`BA 桌宠 ${tag}`,body:fs.readFileSync(`docs/releases/${tag}.md`,'utf8')}));
            release=JSON.parse(gh(['api',base,'--method','POST','--input','release-request.json']));
          }
          if(!release?.draft||release.target_commitish!==process.env.COMMIT)throw Error('Refusing to change an existing published release or another build');
          const expected=fs.readdirSync('publish').map(name=>{
            const bytes=fs.readFileSync(`publish/${name}`);
            return {name,size:bytes.length,digest:`sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`};
          });
          for(const file of expected){
            const asset=release.assets.find(a=>a.name===file.name);
            if(asset){if(asset.size!==file.size||asset.digest!==file.digest)throw Error(`Existing draft asset differs: ${file.name}`);}
            else gh(['release','upload',tag,`publish/${file.name}`]);
          }
          release=JSON.parse(gh(['api',`${base}/${release.id}`]));
          if(release.assets.length!==expected.length)throw Error('Missing uploaded assets');
          for(const file of expected) {
            const asset=release.assets.find(a=>a.name===file.name);
            if(!asset||asset.size!==file.size||asset.digest!==file.digest)throw Error(`Remote checksum mismatch: ${file.name}`);
          }
          gh(['api',`${base}/${release.id}`,'--method','PATCH','-F','draft=false','-f','make_latest=true']);
          console.log(`Published ${tag}: all uploaded files verified.`);
          NODE
