name: Diagnose Intel Mac graphics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - name: Test official Electron runtime before application signing
        run: node tests/platform-desktop.cjs
      - run: npm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test signed application
        run: node tests/platform-desktop.cjs --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-graphics-diagnostics
          path: test-results/*.json
