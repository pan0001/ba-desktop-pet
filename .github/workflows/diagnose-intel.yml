name: Diagnose Intel Mac graphics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            graphics: gl
          - os: macos-15-intel
            graphics: swiftshader-webgl
          - os: macos-15
            graphics: default
    runs-on: ${{ matrix.os }}
    env:
      BA_PET_TEST_GRAPHICS: ${{ matrix.graphics }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - run: npm ci
        env:
          npm_config_arch: x64
      - run: npm run build:native
      - name: Test official Electron runtime before application signing
        run: node tests/platform-desktop.cjs
      - run: npm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test signed application
        run: node tests/platform-desktop.cjs --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-graphics-${{ matrix.os }}-${{ matrix.graphics }}
          path: test-results/*.json
